include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Resource-lifetime rules: this package leaves listener/subscription
    # disposal to the caller, so leaks must fail the build, not just warn.
    close_sinks: error
    cancel_subscriptions: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
