include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Resource-lifetime rules: this package leaves listener/subscription
    # disposal to the caller, so leaks must fail the build, not just warn.
    close_sinks: error
    cancel_subscriptions: error
  exclude:
    - build/**

linter:
  rules:
    # avoid_print and use_super_parameters are already on via
    # flutter_lints/flutter.yaml and lints/recommended.yaml respectively —
    # not repeated here to avoid implying they weren't already covered.
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - prefer_final_locals
    - public_member_api_docs
    # RxBool overrides == (with proper `is bool` / `is RxBool` checks) —
    # guards any future Rx* equality override against skipping that check.
    - test_types_in_equals
    - unawaited_futures
