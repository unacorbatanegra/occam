name: flutter test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # 06:00 UTC every Monday — benchmarks job only (guarded by event_name
    # below), everything else already runs on every push/PR.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs cancel superseded runs; pushes to master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The weekly schedule exists only for the benchmarks job below.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version in .fvmrc (the one the lockfiles were resolved
      # with). Tracking `stable` broke CI when 3.50 deprecated
      # package:flutter/material.dart; bump this together with .fvmrc.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Must run after `pub get`: analysis_options.yaml's `include:` points at
      # package:flutter_lints, and dart format silently falls back to
      # different formatting rules when it can't resolve that — every file
      # would spuriously show up as "needing" a reformat before the packages
      # are fetched.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed ./lib ./test

      # --fatal-infos: most lints (public_member_api_docs, avoid_print, the
      # strict-*-types modes) register at INFO severity, which flutter
      # analyze does not fail the build on by default — without this flag
      # they show up in the log and nowhere else.
      - name: Analyze project source
        run: flutter analyze --fatal-infos ./lib ./test

      - name: Run tests with coverage
        run: flutter test --coverage

      # test_cov_console --pass only PRINTS PASSED/FAILED, it does not set a
      # process exit code — grep for the words ourselves so a drop below 100%
      # actually fails the job instead of only showing up in the log. PASSED
      # must be present too: if the tool crashes and prints nothing, that is
      # a failure, not a pass.
      # occam.dart/occam_debug.dart are excluded: they have no instrumentable
      # lines (library directives / a single static field), so lcov reports
      # them as "no unit testing" and would otherwise drag the total down.
      - name: Enforce 100% coverage
        run: |
          dart run test_cov_console --file=coverage/lcov.info \
            --exclude=occam.dart,occam_debug.dart --pass=100 | tee coverage/report.txt
          grep -q PASSED coverage/report.txt && ! grep -q FAILED coverage/report.txt

      - name: Verify the package is publishable
        run: dart pub publish --dry-run

  example:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # See the root `test` job's comment: must run after `pub get`.
      - name: Verify formatting
        working-directory: example
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        working-directory: example
        run: flutter analyze --fatal-infos .

      - name: Run tests
        working-directory: example
        run: flutter test

  benchmarks:
    # Manual or weekly only — timing numbers are too CI-runner-dependent to
    # gate every push/PR on; this job never fails the build, it just prints.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run benchmarks
        run: |
          flutter test benchmark/rx_notifier_benchmark.dart
          flutter test benchmark/rx_list_benchmark.dart
          flutter test benchmark/widget_benchmark.dart
