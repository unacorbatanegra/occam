name: flutter test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No pinned flutter-version: pubspec.lock requires Dart >= 3.10, so a
      # pinned older SDK breaks resolution. Track stable instead.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed ./lib ./test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze ./lib ./test

      - name: Run tests
        run: flutter test
